name: Retention purge

# 배포 플랫폼(ChatGPT Sites)이 예약 작업을 지원하지 않아, 보존 기간 삭제를
# 외부에서 주기적으로 호출한다. TASK-0001 / WF-09 참조.
#
# 동작 조건:
# - 저장소 시크릿 LANDING_BASE_URL 과 MAINTENANCE_TOKEN 이 설정되어 있어야 한다.
# - 랜딩이 외부에서 접근 가능해야 한다. 소유자 전용 상태에서는 호출이 실패한다.
#   따라서 공개 전까지는 이 워크플로가 성공하지 않는 것이 정상이다.

on:
  schedule:
    # 매일 03:20 UTC. Worker의 기존 cron(17 3 * * *)과 겹치지 않게 둔다.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger retention purge
        env:
          BASE_URL: ${{ secrets.LANDING_BASE_URL }}
          TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL}" ] || [ -z "${TOKEN}" ]; then
            echo "LANDING_BASE_URL 또는 MAINTENANCE_TOKEN 시크릿이 설정되지 않았습니다."
            echo "공개 전이라면 정상입니다. 공개 시점에 두 시크릿을 등록하세요."
            exit 1
          fi

          # 토큰은 Authorization 헤더로만 보낸다. 질의 문자열에 넣으면
          # 접근 로그와 Referer에 남는다.
          status=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            "${BASE_URL%/}/api/maintenance/purge") || {
              echo "정리 요청이 실패했습니다. HTTP ${status:-unknown}"
              cat response.json 2>/dev/null || true
              exit 1
            }

          echo "HTTP ${status}"
          cat response.json

          if [ "${status}" != "202" ]; then
            echo "202를 기대했으나 ${status} 를 받았습니다."
            exit 1
          fi
